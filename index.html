    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2e2d32;
      color: #e3cdb6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      -webkit-user-select: none;
      user-select: none;
    }
    .logo img {
      width: 100%;
      max-width: 320px;
      opacity: 0.9;
    }
    .logo {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e3cdb6;
      opacity: 0.7;
    }
    .timer {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-height: 6rem;
      color: #1998bf;
    }
    .timer.running {
      color: #f16123;
    }
    .timer.ended {
      color: #ec2026;
    }
    .status {
      font-size: 1.2rem;
      min-height: 1.5rem;
      color: #e3cdb6;
      opacity: 0.8;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    button {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 1.2rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    #startBtn { background: #f3c019; color: #2e2d32; }
    #endBtn { background: #ec2026; color: #fff; }
    #resetBtn { background: #e3cdb6; color: #2e2d32; }
  </style>

  <div class="timer" id="timer">2:00</div>
  <div class="status" id="status"></div>
  <div class="buttons">
    <button id="startBtn">Start Jam</button>
    <button id="endBtn" disabled>End Jam</button>
    <button id="resetBtn">Reset</button>
  </div>

  <script>
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const endBtn = document.getElementById('endBtn');
    const resetBtn = document.getElementById('resetBtn');

    let jamInterval = null;
    let jamTimeMs = 0;
    const JAM_DURATION = 120000; // 2 minutes

    let audioCtx;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Wake lock to prevent screen sleeping during jams
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* user denied or not supported */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function playWhistle(duration = 1.0) {
      const t = audioCtx.currentTime;

      // Fox 40-style dual-chamber frequencies
      const freqs = [3200, 3800];

      // Master output with compression to make it loud and cutting
      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-6, t);
      compressor.knee.setValueAtTime(3, t);
      compressor.ratio.setValueAtTime(8, t);
      compressor.attack.setValueAtTime(0.001, t);
      compressor.release.setValueAtTime(0.05, t);
      compressor.connect(audioCtx.destination);

      // Master gain — hard attack, sustain, then drop
      const master = audioCtx.createGain();
      const attack = 0.005;
      const release = Math.min(0.04, duration * 0.3);
      master.gain.setValueAtTime(0.0, t);
      master.gain.linearRampToValueAtTime(0.7, t + attack);
      master.gain.setValueAtTime(0.7, t + duration - release);
      master.gain.linearRampToValueAtTime(0.0, t + duration);
      master.connect(compressor);

      // Two resonant chambers (like a Fox 40 has dual tone holes)
      freqs.forEach(freq => {
        // Main tone
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        // Initial chirp — pitch bends down slightly as air stabilises
        osc.frequency.setValueAtTime(freq * 1.08, t);
        osc.frequency.exponentialRampToValueAtTime(freq, t + 0.04);

        // Pea rattle modulation (different rate per chamber = realistic beating)
        const lfo = audioCtx.createOscillator();
        lfo.frequency.setValueAtTime(freq === 3200 ? 26 : 33, t);
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.setValueAtTime(120, t); // deep modulation
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        // Odd harmonics for edge/bite
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 3, t); // 3rd harmonic

        const g1 = audioCtx.createGain();
        g1.gain.setValueAtTime(0.35, t);
        const g2 = audioCtx.createGain();
        g2.gain.setValueAtTime(0.08, t);

        osc.connect(g1);
        osc2.connect(g2);
        g1.connect(master);
        g2.connect(master);

        osc.start(t); osc.stop(t + duration);
        osc2.start(t); osc2.stop(t + duration);
        lfo.start(t); lfo.stop(t + duration);
      });

      // Turbulent air noise — heavier than before
      const bufferSize = audioCtx.sampleRate * duration;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;

      // Two bandpass filters at each chamber freq for resonant noise
      const bp1 = audioCtx.createBiquadFilter();
      bp1.type = 'bandpass'; bp1.frequency.value = 3200; bp1.Q.value = 6;
      const bp2 = audioCtx.createBiquadFilter();
      bp2.type = 'bandpass'; bp2.frequency.value = 3800; bp2.Q.value = 6;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.18, t);

      noise.connect(bp1);
      noise.connect(bp2);
      bp1.connect(noiseGain);
      bp2.connect(noiseGain);
      noiseGain.connect(master);

      noise.start(t); noise.stop(t + duration);
    }

    function playShortBlasts() {
      // 3 sets of 4 short blasts with a pause between sets
      for (let set = 0; set < 3; set++) {
        for (let i = 0; i < 4; i++) {
          const delay = (set * 1200) + (i * 200);
          setTimeout(() => playWhistle(0.1), delay);
        }
      }
    }

    function speak(text) {
      return new Promise(resolve => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    function formatTime(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      const remaining = JAM_DURATION - jamTimeMs;
      timerEl.textContent = formatTime(Math.max(0, remaining));
    }

    function startJamCountdown() {
      jamTimeMs = 0;
      updateDisplay();

      ensureAudio();

      startBtn.disabled = true;
      endBtn.disabled = true;
      resetBtn.disabled = true;
      statusEl.textContent = 'Five seconds...';

      requestWakeLock();
      speak('Five seconds');
      let countdown = 5;
      timerEl.textContent = '0:05';
      statusEl.textContent = 'Five seconds...';
      const countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerEl.textContent = `0:0${countdown}`;
        } else {
          clearInterval(countdownInterval);
          statusEl.textContent = '';
          playWhistle(0.3); // 1 short blast per WFTDA
          beginJam();
        }
      }, 1000);
    }

    function beginJam() {
      statusEl.textContent = 'Jam in progress';
      timerEl.classList.add('running');
      timerEl.classList.remove('ended');
      endBtn.disabled = false;
      resetBtn.disabled = false;

      const startTime = performance.now();
      jamInterval = setInterval(() => {
        jamTimeMs = performance.now() - startTime;
        updateDisplay();

        if (jamTimeMs >= JAM_DURATION) {
          endJam(true);
        }
      }, 100);
    }

    function endJam(auto = false) {
      ensureAudio();
      clearInterval(jamInterval);
      jamInterval = null;
      endBtn.disabled = true;
      statusEl.textContent = auto ? 'Jam ended (2:00)' : 'Jam called off';
      timerEl.textContent = '0:00';
      timerEl.classList.remove('running');
      timerEl.classList.add('ended');
      playShortBlasts();

      releaseWakeLock();
      setTimeout(() => {
        startBtn.disabled = false;
        resetBtn.disabled = false;
      }, 1500);
    }

    function reset() {
      clearInterval(jamInterval);
      jamInterval = null;
      jamTimeMs = 0;
      updateDisplay();
      statusEl.textContent = '';
      timerEl.classList.remove('running', 'ended');
      startBtn.disabled = false;
      endBtn.disabled = true;
      resetBtn.disabled = false;
      releaseWakeLock();
    }

    startBtn.addEventListener('click', startJamCountdown);
    endBtn.addEventListener('click', () => endJam(false));
    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
