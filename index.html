    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2e2d32;
      color: #e3cdb6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 1rem 1rem env(safe-area-inset-bottom, 1.5rem);
      padding: 1rem 1rem env(safe-area-inset-bottom, 0.5rem);
      -webkit-user-select: none;
      user-select: none;
    }
    .logo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .logo img {
      width: 100%;
      height: 5rem;
      object-fit: cover;
      object-position: top center;
      opacity: 0.5;
    }
    .timer-group {
      text-align: center;
    }
    .timer {
      font-size: clamp(4.5rem, 20vw, 8rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #1998bf;
      line-height: 1;
    }
    .timer.running { color: #f16123; }
    .timer.ended { color: #ec2026; }
    .status {
      font-size: 1rem;
      min-height: 1.2rem;
      color: #e3cdb6;
      opacity: 0.7;
    }
    .buttons-main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      width: 100%;
      max-width: 340px;
    }
    .buttons-secondary {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 340px;
    }
    button {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.7; transform: scale(0.97); }
    .btn-primary {
      font-size: 1.6rem;
      padding: 1.8rem 1.5rem;
    }
    .btn-secondary {
      font-size: 0.95rem;
      padding: 0.8rem 1rem;
      flex: 1;
      opacity: 0.8;
    }
    #startBtn { background: #f3c019; color: #2e2d32; }
    #leadBtn { background: #1998bf; color: #fff; }
    #endBtn { background: #ec2026; color: #fff; }
    #endScrimBtn { background: #f16123; color: #fff; }
    #resetBtn { background: transparent; color: #e3cdb6; border: 1px solid #e3cdb640; }
  </style>

    function playSound(sound) {
      sound.currentTime = 0;
      sound.play();
    }

    // Unlock a single audio element (iOS requires play() during user gesture)
    function unlockSound(sound) {
      sound.volume = 0;
      sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        sound.volume = 1;
      }).catch(() => { sound.volume = 1; });
    }

    // Wake lock to prevent screen sleeping during jams
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* user denied or not supported */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function speak(text) {
      return new Promise(resolve => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    function formatTime(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      const remaining = JAM_DURATION - jamTimeMs;
      timerEl.textContent = formatTime(Math.max(0, remaining));
    }

    function startJamCountdown() {
      jamTimeMs = 0;
      updateDisplay();

      startBtn.disabled = true;
      statusEl.textContent = 'Five seconds...';

      // Unlock start sound now (user gesture) so it can play after 5s delay
      unlockSound(startSound);
      requestWakeLock();
      speak('Five seconds');
      let countdown = 5;
      timerEl.textContent = '0:05';
      statusEl.textContent = 'Five seconds...';
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerEl.textContent = `0:0${countdown}`;
        } else {
          clearInterval(countdownInterval);
          statusEl.textContent = '';
          playSound(startSound);
          beginJam();
        }
      }, 1000);
    }

    function beginJam() {
      statusEl.textContent = 'Jam in progress';
      timerEl.classList.add('running');
      timerEl.classList.remove('ended');
      resetBtn.disabled = false;

      const startTime = performance.now();
      jamInterval = setInterval(() => {
        jamTimeMs = performance.now() - startTime;
        updateDisplay();

        if (jamTimeMs >= JAM_DURATION) {
          endJam(true);
        }
      }, 100);
    }

    function endJam(auto = false) {
      clearInterval(jamInterval);
      jamInterval = null;
      statusEl.textContent = auto ? 'Jam ended (2:00)' : 'Jam called off';
      timerEl.textContent = '0:00';
      timerEl.classList.remove('running');
      timerEl.classList.add('ended');
      // Play end jam sound (single clip with 3x blasts)
      playSound(endSound);

      releaseWakeLock();
      setTimeout(() => {
        startBtn.disabled = false;
        resetBtn.disabled = false;
      }, 3300);
    }

    function reset() {
      clearInterval(jamInterval);
      clearInterval(countdownInterval);
      jamInterval = null;
      countdownInterval = null;
      speechSynthesis.cancel();
      jamTimeMs = 0;
      updateDisplay();
      statusEl.textContent = '';
      timerEl.classList.remove('running', 'ended');
      startBtn.disabled = false;
      resetBtn.disabled = false;
      releaseWakeLock();
    }

    startBtn.addEventListener('click', startJamCountdown);
    leadBtn.addEventListener('click', () => playSound(leadSound));
    endBtn.addEventListener('click', () => endJam(false));
    endScrimBtn.addEventListener('click', () => playSound(endScrimSound));
    resetBtn.addEventListener('click', reset);
  </script>
