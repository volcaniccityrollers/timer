    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2e2d32;
      color: #e3cdb6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      -webkit-user-select: none;
      user-select: none;
    }
    .logo img {
      width: 100%;
      max-width: 320px;
      opacity: 0.9;
    }
    .logo {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e3cdb6;
      opacity: 0.7;
    }
    .timer {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-height: 6rem;
      color: #1998bf;
    }
    .timer.running {
      color: #f16123;
    }
    .timer.ended {
      color: #ec2026;
    }
    .status {
      font-size: 1.2rem;
      min-height: 1.5rem;
      color: #e3cdb6;
      opacity: 0.8;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    button {
      font-family: 'Beachwood', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 1.2rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    #startBtn { background: #f3c019; color: #2e2d32; }
    #leadBtn { background: #1998bf; color: #fff; }
    #endBtn { background: #ec2026; color: #fff; }
    #endScrimBtn { background: #f16123; color: #fff; }
    #resetBtn { background: #e3cdb6; color: #2e2d32; opacity: 1 !important; }
  </style>

    function playSound(sound) {
      sound.currentTime = 0;
      sound.play();
    }

    // Unlock all audio elements on first user tap (iOS requirement)
    // Play each at volume 0, let it play for a frame, then pause and reset
    let audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      [startSound, endSound, endSound2, endSound3, endScrimSound, leadSound].forEach(s => {
        const vol = s.volume;
        s.volume = 0;
        s.play().then(() => {
          setTimeout(() => { s.pause(); s.currentTime = 0; s.volume = vol; }, 1);
        }).catch(() => { s.volume = vol; });
      });
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }
    document.addEventListener('touchstart', unlockAudio);
    document.addEventListener('click', unlockAudio);

    // Wake lock to prevent screen sleeping during jams
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* user denied or not supported */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function speak(text) {
      return new Promise(resolve => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    function formatTime(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      const remaining = JAM_DURATION - jamTimeMs;
      timerEl.textContent = formatTime(Math.max(0, remaining));
    }

    function startJamCountdown() {
      jamTimeMs = 0;
      updateDisplay();

      startBtn.disabled = true;
      statusEl.textContent = 'Five seconds...';

      requestWakeLock();
      speak('Five seconds');
      let countdown = 5;
      timerEl.textContent = '0:05';
      statusEl.textContent = 'Five seconds...';
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerEl.textContent = `0:0${countdown}`;
        } else {
          clearInterval(countdownInterval);
          statusEl.textContent = '';
          playSound(startSound);
          beginJam();
        }
      }, 1000);
    }

    function beginJam() {
      statusEl.textContent = 'Jam in progress';
      timerEl.classList.add('running');
      timerEl.classList.remove('ended');
      resetBtn.disabled = false;

      const startTime = performance.now();
      jamInterval = setInterval(() => {
        jamTimeMs = performance.now() - startTime;
        updateDisplay();

        if (jamTimeMs >= JAM_DURATION) {
          endJam(true);
        }
      }, 100);
    }

    function endJam(auto = false) {
      clearInterval(jamInterval);
      jamInterval = null;
      statusEl.textContent = auto ? 'Jam ended (2:00)' : 'Jam called off';
      timerEl.textContent = '0:00';
      timerEl.classList.remove('running');
      timerEl.classList.add('ended');
      // Play end jam sound 3 times with fixed timing
      playSound(endSound);
      setTimeout(() => playSound(endSound2), 1050);
      setTimeout(() => playSound(endSound3), 2100);

      releaseWakeLock();
      setTimeout(() => {
        startBtn.disabled = false;
        resetBtn.disabled = false;
      }, 1500);
    }

    function reset() {
      clearInterval(jamInterval);
      clearInterval(countdownInterval);
      jamInterval = null;
      countdownInterval = null;
      speechSynthesis.cancel();
      jamTimeMs = 0;
      updateDisplay();
      statusEl.textContent = '';
      timerEl.classList.remove('running', 'ended');
      startBtn.disabled = false;
      resetBtn.disabled = false;
      releaseWakeLock();
    }

    startBtn.addEventListener('click', startJamCountdown);
    leadBtn.addEventListener('click', () => playSound(leadSound));
    endBtn.addEventListener('click', () => endJam(false));
    endScrimBtn.addEventListener('click', () => playSound(endScrimSound));
    resetBtn.addEventListener('click', reset);
  </script>
